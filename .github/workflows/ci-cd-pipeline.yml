name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java (if Spring Boot)
        uses: actions/setup-java@v3
        with:
          java-version: '17' # Update as per your project
          distribution: 'temurin'

      - name: Build application
        run: |
          ./mvnw clean package # Adjust for Gradle or npm as needed

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run tests
        run: |
          ./mvnw test # Replace for other testing frameworks/tools

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' # Deploy only from the main branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to production
        run: |
          echo "Deploying to production server..."
          # Add deployment script or command (e.g., SSH, AWS CLI, Kubernetes, Docker Compose)
